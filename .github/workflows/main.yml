name: MLflow CI Pipeline

on:
  push:
    branches:
      - Main

jobs:
  retrain-model:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Setup Python ──────────────────────────────────────────────────────
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      # ── 3. Check Env ─────────────────────────────────────────────────────────
      - name: Check Env
        run: |
          python --version
          pip --version
          echo "Working directory: $(pwd)"
          ls -la
          ls -la MLProject/

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow
          pip install -r MLProject/requirements.txt

      # ── 5. Setup Miniconda ───────────────────────────────────────────────────
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12.7"
          activate-environment: superstore-env

      # ── 6. Run mlflow project ────────────────────────────────────────────────
      - name: Run mlflow project
        shell: bash -l {0}
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          cd MLProject
          mlflow run . --env-manager=conda

      # ── 7. Get latest MLflow run_id ──────────────────────────────────────────
      - name: Get latest MLflow run_id
        id: get_run_id
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          RUN_ID=$(python - <<'PYEOF'
          import mlflow, os
          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          client = mlflow.tracking.MlflowClient()
          exp = client.get_experiment_by_name("Superstore_Profit_Classification_Base")
          runs = client.search_runs(
              experiment_ids=[exp.experiment_id],
              order_by=["metrics.f1_score DESC"],
              max_results=1,
          )
          print(runs[0].info.run_id)
          PYEOF
          )
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Latest MLflow run_id: $RUN_ID"

      # ── 8. Install Python dependencies ───────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install mlflow scikit-learn pandas numpy matplotlib seaborn

      # ── 9. Upload to Github ───────────────────────────────────────────────────
      - name: Upload to Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MLProject/mlruns/ MLProject/artifacts/ || true
          git commit -m "ci: auto-update mlflow runs & artifacts [skip ci]" || echo "No changes to commit"
          git push

      # ── 10. Build Docker Model ───────────────────────────────────────────────
      - name: Build Docker Model
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/superstore-model:latest .

      # ── 11. Log in to Docker Hub ─────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 12. Tag Docker Image ─────────────────────────────────────────────────
      - name: Tag Docker Image
        run: |
          docker tag \
            ${{ secrets.DOCKER_USERNAME }}/superstore-model:latest \
            ${{ secrets.DOCKER_USERNAME }}/superstore-model:${{ steps.get_run_id.outputs.run_id }}

      # ── 13. Push Docker Image ────────────────────────────────────────────────
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/superstore-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/superstore-model:${{ steps.get_run_id.outputs.run_id }}